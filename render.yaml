services:
  # FastAPI Backend Web Service
  - type: web
    name: project-intelligence-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python create_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: project-advisor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EMBEDDING_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # React 19 Frontend Static Site
  - type: web
    name: project-intelligence-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: project-intelligence-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: project-advisor-db
    databaseName: ai_project_db
    user: project_user
    plan: free
